<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07101d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><title>Noyau Zéro</title></head><body>
<section id="home" class="screen active"><div class="card"><h1>NOYAU ZÉRO</h1><small>VERSION 8.0</small><p>Survis, monte de niveau et élimine les gardiens.</p><div id="records"></div><button id="play">JOUER</button><p class="help">Pose le doigt sur la zone de jeu puis glisse. La vitesse reste fixe.</p></div></section>
<section id="game" class="screen"><canvas id="c"></canvas><header id="hud"><div class="hudrow"><b>PV <span id="hptext">100/100</span></b><div class="bar hp"><i id="hpbar"></i></div><b id="timer">0:00</b></div><div class="hudrow"><b>NIV. <span id="level">1</span></b><div class="bar xp"><i id="xpbar"></i></div><span><b id="xptext">0/8</b> XP</span></div><div class="stats"><span>☠ <b id="kills">0</b></span><span>🪙 <b id="coins">0</b></span><span>◆ <b id="cores">0</b></span><button id="quit">×</button></div></header><div id="bossHud"><b id="bossName"></b><span id="bossLife"></span><div class="bossbar"><i id="bossbar"></i></div></div><div id="notice"></div><div id="swordCooldown" aria-label="Recharge de la pique"><div id="swordFill"></div><span>🗡️</span><small id="swordCdText">PRÊT</small></div><button id="merchantBtn" aria-label="Ouvrir le marchand"><span>🛒</span><small id="merchantTimer">45s</small></button><div id="joy"><i></i></div><div id="pause" class="overlay"><div class="card"><h2>PAUSE</h2><button id="resume">CONTINUER</button></div></div><div id="merchant" class="overlay"><div class="levelpanel"><h2>MARCHAND</h2><p id="merchantText">Équipe-toi pour survivre.</p><div id="shop"></div><button id="closeShop" class="secondary">FERMER</button></div></div><div id="levelup" class="overlay"><div class="levelpanel"><h2>NIVEAU SUPÉRIEUR</h2><p>Choisis une amélioration</p><div id="choices"></div></div></div></section>
<section id="over" class="screen"><div class="card"><h2>PARTIE TERMINÉE</h2><div id="summary"></div><button id="again">REJOUER</button><button id="menu" class="secondary">ACCUEIL</button></div></section><script src="./app.js"></script></body></html>
